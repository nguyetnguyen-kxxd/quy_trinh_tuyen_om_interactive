<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 860" style="width:100%; min-width:850px; height:auto; font-family:'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#64748b"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#10b981"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#ef4444"/>
    </marker>
  </defs>

  <!-- Background Lanes -->
  <rect x="0" y="0" width="250" height="860" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="250" y="0" width="250" height="860" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="500" y="0" width="250" height="860" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="750" y="0" width="250" height="860" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>

  <!-- Lane Headers -->
  <rect x="5" y="6" width="240" height="42" fill="#2563eb" rx="5"/>
  <text x="125" y="32" fill="#ffffff" font-size="12.5" font-weight="700" text-anchor="middle">1. ỨNG VIÊN OM (Applicant)</text>

  <rect x="255" y="6" width="240" height="42" fill="#0284c7" rx="5"/>
  <text x="375" y="32" fill="#ffffff" font-size="12.5" font-weight="700" text-anchor="middle">2. BAN VẬN HÀNH / PMO (Thu Hà)</text>

  <rect x="505" y="6" width="240" height="42" fill="#7c3aed" rx="5"/>
  <text x="625" y="32" fill="#ffffff" font-size="12.5" font-weight="700" text-anchor="middle">3. HỘI ĐỒNG CHUYÊN MÔN / EXAMINER</text>

  <rect x="755" y="6" width="240" height="42" fill="#0d9488" rx="5"/>
  <text x="875" y="32" fill="#ffffff" font-size="12.5" font-weight="700" text-anchor="middle">4. BAN QUẢN LÝ DỰ ÁN (Võ Duy Anh)</text>

  <!-- START -->
  <rect x="45" y="62" width="160" height="34" rx="17" fill="#10b981" stroke="#059669" stroke-width="2"/>
  <text x="125" y="84" fill="#ffffff" font-size="11.5" font-weight="600" text-anchor="middle">Khởi động: Đăng ký dự tuyển</text>

  <!-- GĐ 1: Profile Scanning -->
  <path d="M125 96 L125 116" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="25" y="116" width="200" height="46" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="125" y="135" font-size="11" font-weight="700" text-anchor="middle" fill="#1e293b">GĐ 1: Gửi hồ sơ BM-OM-01</text>
  <text x="125" y="151" font-size="9.5" fill="#64748b" text-anchor="middle">(OM giới thiệu + Trải nghiệm ≥ 2 phiên)</text>

  <path d="M225 139 L285 139" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>

  <polygon points="375,115 450,139 375,163 300,139" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <text x="375" y="135" font-size="10" font-weight="700" text-anchor="middle" fill="#92400e">Hợp lệ &amp; Rubric</text>
  <text x="375" y="148" font-size="10" font-weight="700" text-anchor="middle" fill="#92400e">&gt; 6/10 &amp; TC2 &gt; 1?</text>

  <path d="M375 163 L375 186" stroke="#ef4444" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <rect x="300" y="186" width="150" height="28" rx="4" fill="#fee2e2" stroke="#ef4444" stroke-width="1"/>
  <text x="375" y="204" font-size="9" fill="#991b1b" font-weight="700" text-anchor="middle">Từ chối: Gửi Email EM-OM-02</text>

  <!-- GĐ 2: Online Training -->
  <path d="M450 139 L475 139 L475 235 L375 235" stroke="#10b981" stroke-width="2" fill="none" marker-end="url(#arr-green)"/>
  <text x="480" y="180" font-size="9.5" fill="#059669" font-weight="700">Đạt GĐ 1</text>

  <rect x="275" y="220" width="200" height="48" rx="6" fill="#ffffff" stroke="#0284c7" stroke-width="1.5"/>
  <text x="375" y="239" font-size="10.5" font-weight="700" text-anchor="middle" fill="#1e293b">GĐ 2: Cấp Trial Account 1 tháng</text>
  <text x="375" y="254" font-size="9.5" fill="#64748b" text-anchor="middle">Gửi 10 Video + Cẩm nang v3.0</text>

  <path d="M275 244 L125 244 L125 285" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  <rect x="25" y="285" width="200" height="48" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="125" y="304" font-size="10.5" font-weight="700" text-anchor="middle" fill="#1e293b">Tự học 4 tuần &amp; Thực tế</text>
  <text x="125" y="319" font-size="9.5" fill="#64748b" text-anchor="middle">Hỗ trợ 1 session + Gửi câu hỏi TA</text>

  <path d="M225 309 L525 309" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="525" y="285" width="200" height="48" rx="6" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="625" y="304" font-size="10.5" font-weight="700" text-anchor="middle" fill="#1e293b">Tổ chức Buổi TA Q&amp;A (2h)</text>
  <text x="625" y="319" font-size="9.5" fill="#64748b" text-anchor="middle">Xác nhận hoàn thành Gate 2</text>

  <!-- GĐ 3: Written Test -->
  <path d="M625 333 L625 365" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
  <polygon points="625,365 700,389 625,413 550,389" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <text x="625" y="385" font-size="10" font-weight="700" text-anchor="middle" fill="#92400e">GĐ 3: Written Test</text>
  <text x="625" y="398" font-size="10" font-weight="700" text-anchor="middle" fill="#92400e">Điểm ≥ 6.5/10?</text>

  <path d="M700 389 L730 389 L730 425 L650 425" stroke="#ef4444" stroke-width="1.5" fill="none"/>
  <rect x="545" y="435" width="160" height="26" rx="4" fill="#fee2e2" stroke="#ef4444" stroke-width="1"/>
  <text x="625" y="452" font-size="8.5" fill="#991b1b" text-anchor="middle">Chưa đạt: Thi lại 1 lần / Dừng</text>

  <!-- GĐ 4: Demo Event -->
  <path d="M550 389 L225 389 L225 480 L125 480 L125 500" stroke="#10b981" stroke-width="2" fill="none" marker-end="url(#arr-green)"/>
  <text x="320" y="382" font-size="9.5" fill="#059669" font-weight="700">Đạt thi viết (≥ 6.5đ)</text>

  <rect x="25" y="500" width="200" height="48" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="125" y="519" font-size="10.5" font-weight="700" text-anchor="middle" fill="#1e293b">GĐ 4: Tự tổ chức Demo Event</text>
  <text x="125" y="534" font-size="9.5" fill="#64748b" text-anchor="middle">≥ 5 người chơi thật (6 phases)</text>

  <path d="M225 524 L525 524" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="525" y="500" width="200" height="48" rx="6" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="625" y="519" font-size="10.5" font-weight="700" text-anchor="middle" fill="#1e293b">Examiner chấm Live Rubric</text>
  <text x="625" y="534" font-size="9.5" fill="#64748b" text-anchor="middle">Thang 100đ (+10đ thưởng) ĐG-OM-01</text>

  <path d="M625 548 L625 572" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
  <polygon points="625,572 705,596 625,620 545,596" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <text x="625" y="592" font-size="9.5" font-weight="700" text-anchor="middle" fill="#92400e">Điểm ≥ 65/100 &amp;</text>
  <text x="625" y="605" font-size="9.5" font-weight="700" text-anchor="middle" fill="#92400e">Độ chính xác ≥ 6 &amp; Tin cậy ≥ 6?</text>

  <path d="M545 596 L495 596 L495 524 L525 524" stroke="#d97706" stroke-width="1.5" fill="none"/>
  <text x="500" y="585" font-size="8.5" fill="#d97706">Chưa đạt: Demo lại lần 2</text>

  <!-- GĐ 5: Final Interview -->
  <path d="M705 596 L875 596 L875 640 L725 640" stroke="#10b981" stroke-width="2" fill="none" marker-end="url(#arr-green)"/>
  <text x="760" y="588" font-size="9.5" fill="#059669" font-weight="700">Đạt Demo Event</text>

  <rect x="525" y="625" width="200" height="46" rx="6" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="625" y="644" font-size="10.5" font-weight="700" text-anchor="middle" fill="#1e293b">GĐ 5: Final Interview (20-30p)</text>
  <text x="625" y="659" font-size="9.5" fill="#64748b" text-anchor="middle">Động lực &amp; Định hướng 5 năm (BM-04)</text>

  <!-- Gate 5 & Tờ trình -->
  <path d="M625 671 L625 695" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
  <polygon points="625,695 695,717 625,739 555,717" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <text x="625" y="714" font-size="9.5" font-weight="700" text-anchor="middle" fill="#92400e">Điểm ≥ 6.5/10 &amp;</text>
  <text x="625" y="726" font-size="9.5" font-weight="700" text-anchor="middle" fill="#92400e">Không vi phạm Đạo đức?</text>

  <path d="M695 717 L775 717" stroke="#10b981" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="715" y="709" font-size="9.5" fill="#059669" font-weight="700">Đạt chuẩn</text>

  <!-- BGD Phê chuẩn -->
  <rect x="775" y="695" width="195" height="46" rx="6" fill="#ffffff" stroke="#0d9488" stroke-width="1.5"/>
  <text x="872" y="714" font-size="10.5" font-weight="700" text-anchor="middle" fill="#1e293b">Tờ trình TT-OM-01</text>
  <text x="872" y="729" font-size="9.5" fill="#0d9488" font-weight="700" text-anchor="middle">Ký Quyết định QĐ-OM-01</text>

  <!-- Ký Hợp đồng Subscription & Bàn giao Kit -->
  <path d="M872 741 L872 785 L475 785" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  <rect x="275" y="760" width="200" height="50" rx="6" fill="#ffffff" stroke="#0284c7" stroke-width="1.5"/>
  <text x="375" y="780" font-size="10" font-weight="700" text-anchor="middle" fill="#1e293b">Ký HĐ Subscription CK-OM-01</text>
  <text x="375" y="796" font-size="9" fill="#64748b" text-anchor="middle">Cấp manage.html &amp; Bàn giao Kit BB-01</text>

  <!-- CHÍNH THỨC CERTIFIED OM -->
  <path d="M275 785 L205 785" stroke="#10b981" stroke-width="2" marker-end="url(#arr-green)"/>
  <rect x="25" y="760" width="180" height="50" rx="25" fill="#10b981" stroke="#059669" stroke-width="2.5"/>
  <text x="115" y="782" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle">CÔNG NHẬN CHÍNH THỨC</text>
  <text x="115" y="798" fill="#ffffff" font-size="11.5" font-weight="800" text-anchor="middle">CERTIFIED OFFLIFE MASTER</text>
</svg>